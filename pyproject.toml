[project]
name = "listing-writer"
version = "0.1.0"
description = "Photo in, listing out: Claude writes titles, descriptions and tags for Vinted, eBay and Etsy, and a guardrail removes brands and sizes the photo does not show."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "anthropic>=0.80", "pillow>=10"]

[project.optional-dependencies]
demo = ["streamlit>=1.50"]
dev = ["pytest", "streamlit>=1.50"]

[project.scripts]
listing-writer = "listing_writer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
